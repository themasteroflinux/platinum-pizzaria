<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rewards Login | Platinum Pizzaria</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
html{background:silver;font-family:Arial,sans-serif}
body{margin:0}
.header{background:#C1C6C8;padding:10px;border-bottom:2px solid;position:sticky;top:0;z-index:2}
.header img{height:40px;vertical-align:middle}
.header a{color:#000;text-decoration:none}
.wrap{max-width:520px;margin:55px auto;padding:20px}
.card{background:#fff;border:2px solid;border-radius:8px;padding:28px;box-shadow:6px 6px 0 rgba(0,0,0,.15)}
h1{margin-top:0}
.sub{color:#555}
label{display:block;font-weight:bold;margin-top:16px}
input{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border:2px solid #222;border-radius:5px;font-size:16px}

button{
  background:blue;
  color:#fff;
  border:0;
  border-radius:50px;
  padding:12px 22px;
  margin-top:20px;
  cursor:pointer;
  font-size:16px
}

.secondary{background:#444;margin-left:6px}

.github-btn{
  display:block;
  width:100%;
  box-sizing:border-box;
  background:#24292f;
  color:#fff;
  border:0;
  border-radius:50px;
  padding:12px 22px;
  margin-top:18px;
  cursor:pointer;
  font-size:16px;
  font-weight:bold
}

.divider{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:20px;
  color:#777;
  font-size:13px
}

.divider::before,
.divider::after{
  content:"";
  flex:1;
  height:1px;
  background:#ccc
}

.msg{margin-top:16px;padding:10px;border-radius:5px;display:none}
.error{background:#ffd9d9;color:#8b0000}
.ok{background:#ddffdd;color:#155724}
.links{margin-top:18px}
.links button{background:none;color:#000;padding:0;margin:0;text-decoration:underline}
.hidden{display:none}
.userbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
</style>

<link rel="icon" type="image/x-icon" href="fav.png">
</head>

<body>

<div class="header">
  <img src="logo.png" alt="Platinum Pizzaria"><br>
  <a href="index.html">Home</a> |
  <a href="menu.html">Menu</a> |
  <strong>Rewards</strong>
</div>

<div class="wrap">

<div class="card" id="auth-card">

<h1>Platinum Rewards</h1>
<p class="sub">Sign in to your Platinum Pizzaria rewards account.</p>

<form id="login-form">

<label>
  Email
  <input id="email" type="email" autocomplete="email" required>
</label>

<label>
  Password
  <input id="password" type="password" autocomplete="current-password" required>
</label>

<button type="submit">Sign In</button>
<button type="button" class="secondary" id="signup">Create Account</button>

<div class="divider">OR</div>

<button type="button" class="github-btn" id="github-login">
  Continue with GitHub
</button>

</form>

<div class="links">
  <button id="forgot" type="button">Forgot your password?</button>
</div>

<div id="msg" class="msg"></div>

</div>

<div class="card hidden" id="member-card">

<div class="userbar">
  <div>
    <h1>Rewards</h1>
    <p id="member-email"></p>
  </div>
  <button id="logout">Sign Out</button>
</div>

<hr>

<p id="points">Loading your rewards...</p>

<a href="order.html">
  <button>Order Pizza</button>
</a>

</div>

</div>

<script>

const SUPABASE_URL='https://rrpnmxucqlpaaueufsmb.supabase.co';

const SUPABASE_KEY='sb_publishable_scPdBcRV7V0X_VN1IaZPsw_BxxCvxmN';

const db=supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const msg=document.getElementById('msg');

function show(text,ok=false){
  msg.textContent=text;
  msg.className='msg '+(ok?'ok':'error');
  msg.style.display='block';
}

async function showMember(session){

  if(!session)return;

  document.getElementById('auth-card').classList.add('hidden');
  document.getElementById('member-card').classList.remove('hidden');

  document.getElementById('member-email').textContent=
    session.user.email||'';

  const {data,error}=await db
    .from('reward_accounts')
    .select('points,tier')
    .eq('user_id',session.user.id)
    .maybeSingle();

  document.getElementById('points').textContent=
    error
      ? 'Rewards account is not available yet.'
      : data
        ? `Points: ${data.points} • Tier: ${data.tier}`
        : 'Rewards account ready — place an order to start earning.';
}

db.auth.getSession().then(({data})=>{
  showMember(data.session);
});

db.auth.onAuthStateChange((_event,session)=>{

  if(session){
    showMember(session);
  }else{
    document.getElementById('auth-card').classList.remove('hidden');
    document.getElementById('member-card').classList.add('hidden');
  }

});

document.getElementById('login-form').addEventListener(
  'submit',
  async e=>{

    e.preventDefault();

    const {error}=await db.auth.signInWithPassword({
      email:email.value.trim(),
      password:password.value
    });

    if(error)show(error.message);

  }
);

document.getElementById('signup').onclick=async()=>{

  const e=email.value.trim();
  const p=password.value;

  if(!e||p.length<8)
    return show(
      'Enter an email and a password of at least 8 characters.'
    );

  const {error}=await db.auth.signUp({
    email:e,
    password:p,
    options:{
      emailRedirectTo:location.origin+'/rewards.html'
    }
  });

  if(error)
    show(error.message);
  else
    show(
      'Account created. Check your email if confirmation is required.',
      true
    );

};

/* GitHub OAuth */

document.getElementById('github-login').onclick = async () => {
  console.log('GitHub button clicked');

  try {
    const { data, error } = await db.auth.signInWithOAuth({
      provider: 'github',
      options: {
        redirectTo: window.location.href
      }
    });

    console.log('GitHub OAuth result:', data, error);

    if (error) {
      show('GitHub login error: ' + error.message);
    }
  } catch (err) {
    console.error('GitHub OAuth exception:', err);
    show('GitHub login error: ' + err.message);
  }
};

document.getElementById('forgot').onclick=async()=>{

  const e=email.value.trim();

  if(!e)
    return show('Enter your email first.');

  const {error}=await db.auth.resetPasswordForEmail(
    e,
    {
      redirectTo:location.origin+'/reset-password.html'
    }
  );

  if(error)
    show(error.message);
  else
    show(
      'Password reset instructions sent if that email has an account.',
      true
    );

};

document.getElementById('logout').onclick=()=>{
  db.auth.signOut();
};

</script>

</body>
</html>
