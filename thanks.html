<script>
(async function verifyTalerReturn() {
    const params = new URLSearchParams(window.location.search);
    const urlOrderId = params.get('order_id');
    // Prefer the ID supplied by Taler. If an older checkout returned the literal
    // placeholder, recover the actual ID saved before redirecting to the wallet.
    const savedOrderId = (() => {
        try {
            return localStorage.getItem('platinumTalerOrderId') ||
                sessionStorage.getItem('platinumTalerOrderId');
        } catch (_) {
            return sessionStorage.getItem('platinumTalerOrderId');
        }
    })();
    const orderId = (urlOrderId && urlOrderId !== '${ORDER_ID}')
        ? urlOrderId
        : savedOrderId;
    if (!orderId) return;

    const status = document.createElement('p');
    status.id = 'taler-payment-status';
    status.style.cssText = 'padding:14px;border:2px solid #333;background:#fff;margin:15px 0;font-weight:bold';
    document.body.insertBefore(status, document.body.querySelector('h1'));

    // Give customers a direct link to this specific GNU Taler order.
    // Use the returned order ID so each checkout links to its own order page.
    const talerOrderLink = document.createElement('a');
    talerOrderLink.href = (backend || '#') + '/orders/' + encodeURIComponent(orderId);
    talerOrderLink.textContent = 'View GNU Taler order';
    talerOrderLink.target = '_blank';
    talerOrderLink.rel = 'noopener noreferrer';
    talerOrderLink.style.cssText = 'display:inline-block;margin:0 0 15px;padding:10px 14px;background:#eee;border:1px solid #333;border-radius:5px;color:#000;font-weight:bold';
    status.insertAdjacentElement('afterend', talerOrderLink);

    try {
        if (!backend || !/^https:\/\//i.test(backend)) { throw new Error('The secure GNU Taler merchant URL was not saved. Please return to checkout and try again.'); }\n        status.textContent = 'Verifying GNU Taler payment...';
        // The public order-status endpoint is intentionally unauthenticated and is
        // designed for browser-based shop integrations. The private endpoint requires
        // a merchant login token and must not expose merchant credentials in this page.
        const response = await fetch(backend + '/orders/' + encodeURIComponent(orderId), {
            headers: { 'Accept': 'application/json' }
        });

        // GNU Taler returns 200 for paid orders and 402 for orders still awaiting payment.
        // Do not treat redirects, 202, or other successful HTTP statuses as proof of payment.
        if (response.status === 402) {
            status.textContent = 'Payment not confirmed. Your order has NOT been submitted. Complete the payment in your GNU Taler wallet, then refresh this page.';
            return;
        }
        if (response.status !== 200) {
            let failure = {};
            try { failure = await response.json(); } catch (_) {}
            throw new Error(failure.detail || failure.hint || ('Merchant backend returned HTTP ' + response.status + '.'));
        }
        const payment = await response.json();

        const savedOrderJson = (() => {
            try {
                return localStorage.getItem('platinumTalerPendingOrder') ||
                    sessionStorage.getItem('platinumTalerPendingOrder');
            } catch (_) {
                return sessionStorage.getItem('platinumTalerPendingOrder');
            }
        })();
        const savedFlagKey = 'platinumTalerSaved:' + orderId;
        let alreadySaved = false;
        try {
            alreadySaved = localStorage.getItem(savedFlagKey) === 'yes' ||
                sessionStorage.getItem(savedFlagKey) === 'yes';
        } catch (_) {
            alreadySaved = sessionStorage.getItem(savedFlagKey) === 'yes';
        }

        let verifiedOrder = null;
        if (!alreadySaved) {
            if (!savedOrderJson) {
                status.textContent = 'Payment verified, but the pending order details could not be recovered. Please contact the restaurant with Taler order ID ' + orderId + '.';
                return;
            }

            verifiedOrder = JSON.parse(savedOrderJson);
            const client = window.supabase.createClient(
                'https://rrpnmxucqlpaaueufsmb.supabase.co',
                'sb_publishable_scPdBcRV7V0X_VN1IaZPsw_BxxCvxmN'
            );
            const { data: { session } } = await client.auth.getSession();
            verifiedOrder.user_id = session?.user?.id || verifiedOrder.user_id || null;
            verifiedOrder.cardtype = 'GNU Taler (KUDOS)';
            const { error } = await client.from('orders').insert([verifiedOrder]);
            if (error) throw error;

            try {
                localStorage.setItem(savedFlagKey, 'yes');
                localStorage.removeItem('platinumTalerPendingOrder');
                localStorage.removeItem('platinumTalerOrderId');\n                localStorage.removeItem('platinumTalerBackendUrl');
            } catch (_) {}
            sessionStorage.setItem(savedFlagKey, 'yes');
            sessionStorage.removeItem('platinumTalerPendingOrder');
        } else if (savedOrderJson) {
            verifiedOrder = JSON.parse(savedOrderJson);
        }

        const verifiedTotal = verifiedOrder
            ? ['personpizza', 'onemancombo', 'gpizza', 'garbread']
                .reduce((sum, field) => sum + ((Number.parseInt(verifiedOrder[field], 10) || 0) * 5), 0)
            : null;
        status.style.borderColor = 'green';
        status.textContent = verifiedTotal === null
            ? 'GNU Taler payment verified and your order was already submitted. Opening your Taler order...'
            : 'GNU Taler payment verified! Your order was submitted to Platinum Pizzaria. Amount: KUDOS ' + verifiedTotal.toFixed(2) + '. Opening your Taler order...';

        const talerOrderUrl = backend + '/orders/' + encodeURIComponent(orderId);
        talerOrderLink.href = talerOrderUrl;
        talerOrderLink.textContent = 'Open GNU Taler order now';
        try {
            localStorage.removeItem('platinumTalerOrderId');
        } catch (_) {}
        sessionStorage.removeItem('platinumTalerOrderId');\n        sessionStorage.removeItem('platinumTalerBackendUrl');

        // Automatically open the confirmed order page after the restaurant order is saved.
        window.setTimeout(() => window.location.replace(talerOrderUrl), 1800);
    } catch (error) {
        console.error('Taler payment verification failed:', error);
        status.textContent = 'We could not verify this GNU Taler payment: ' + (error.message || 'Unknown error') + '. Your order has not been submitted.';
    }
})();
</script>
