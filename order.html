<!DOCTYPE html>
<!-- Harmless deployment refresh to load the current Cloudflare Pages environment variables. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select A Driver | Platinum Pizzaria</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        html { background-color: silver; font-family: arial; }
        div.header {
            background-color: #C1C6C8;
            color: black;
            width: 100%;
            top: 0px;
            position: fixed;
            left: 0px;
            padding: 10px;
            border-bottom: solid 2px;
            z-index: 1000;
        }
        a { color: black; text-decoration: none; }
        .container { margin-top: 120px; padding: 20px; }
        div.driver {
            border: solid 2px;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
            background-color: rgba(255,255,255,0.3);
        }
        button, input[type="submit"] {
            background-color: blue;
            border: none;
            border-radius: 50px;
            color: white;
            margin: 5px;
            padding: 10px 20px;
            cursor: pointer;
        }
        hr { background-color: black; border: none; height: 2px; }
        input[type="number"], input[type="text"] { padding: 5px; margin-bottom: 10px; }
    </style>
    <link rel="icon" type="image/x-icon" href="fav.png">
</head>
<body>

<div class="header">
    <img src="logo.png" height="40px"><br>
    <a href="index.html">Home | </a>
    <a href="menu.html">Menu | </a>
    <a href="rewards.html">Rewards</a> | <a href="#">Order</a>
</div>

<div class="container">
    <p id="account-note" style="border:1px solid #333;padding:10px;background:#fff3cd">Checking rewards account...</p>
    <form id="orderForm">
        <div class="driver">
            <h1>Select A Driver</h1>
            <input type="radio" name="driver" id="jn" value="Jason Naish" required>
            <label for="jn">Jason Naish</label><br>
            <input type="radio" name="driver" id="dd" value="Deacon Danford" required>
            <label for="dd">Deacon Danford</label><br>
            <input type="radio" id="fk" name="driver" value="Fox Kay" required>
            <label for="fk">Fox Kay</label><br>
            <input type="radio" id="js" name="driver" value="Jaemon Spano" required>
            <label for="js">Jaemon Spano</label><br>
            <input type="radio" id="ns" name="driver" value="Norah Sellner" required>
            <label for="ns">Norah Sellner</label><br>
            <input type="radio" id="gm" name="driver" value="Greer Moses" required>
            <label for="gm">Greer Moses</label><br>
            <input type="radio" id="vg" name="driver" value="Vera Genourous" disabled required>
            <label for="vg">Vera Genourous</label><br>
            <input type="radio" id="cg" name="driver" value="Claire Gross" required>
            <label for="cg">Claire Gross</label><br>
            <input type="radio" id="jf" name="driver" value="Jacob Fitzhugh" required>
            <label for="jf">Jacob Fitzhugh</label><br>
            <input type="radio" id="jb" name="driver" value="Jaxson Bennett" required>
            <label for="jb">Jaxson Bennett</label><br>
            
            <input type="radio" id="tg" name="driver" value="Tyler Grill" disabled required>
            <label for="tg">Tyler Grill</label><br>
            
            <input type="radio" id="l0" name="driver" value="Lucas" disabled required>
            <label for="l0">Lucas</label><br>
            <input type="radio" id="m0" name="driver" value="Miles" required>
            <label for="m0">Miles Berhinger</label><br>
        </div>

        <div class="driver">
            <h1>Order Details</h1>
            <p>Personal Pizza</p><input type="number" min="0" max="10" name="personpizza" value="0">
            <hr>
            <p>One Man Combo</p><input type="number" min="0" max="10" name="onemancombo" value="0"> 
            <hr>
            <p>Group Pizza</p><input type="number" min="0" max="10" name="gpizza" value="0">
            <hr>
            <p>Garlic Bread</p><input type="number" min="0" max="10" name="garbread" value="0">
        </div>

        <div class="driver">
            <h1>Order Name</h1>
            <input name="customer_name" type="text" required>
            <hr>
            <h1>Payment Method</h1>
            <input type="radio" id="card_payment" name="payment_method" value="Credit/Debit" required>
            <label for="card_payment">Credit/Debit</label><br>
            
            <input type="radio" id="v" name="payment_method" value="Venmo" required>
            <label for="v">Venmo</label><br>
            <input type="radio" id="p" name="payment_method" value="PayPal" required>
            <label for="p">PayPal</label><br>
            <input type="radio" id="r" name="payment_method" value="ROTK E-port" required>
            <label for="r">ROTK E-port</label><br>
            <input type="radio" id="taler_payment" name="payment_method" value="GNU Taler" required>
            <label for="taler_payment">GNU Taler (KUDOS)</label><br>
            <p id="taler-price-note" style="background:#fff3cd;padding:10px;border:1px solid #856404">
              Self-hosted GNU Taler checkout. Each menu item is KUDOS 5.00.
              <br><strong>GNU Taler total: <span id="taler-total">KUDOS 0.00</span></strong>
            </p>
            <br><br>
            <input type="submit" value="Place Order">
        </div>
    </form>
</div>
<script>
// 1. Initialize Supabase
const _supabaseUrl = 'https://rrpnmxucqlpaaueufsmb.supabase.co';
const _supabaseKey = 'sb_publishable_scPdBcRV7V0X_VN1IaZPsw_BxxCvxmN';

const db = supabase.createClient(_supabaseUrl, _supabaseKey);

const accountNote=document.getElementById('account-note');
db.auth.getSession().then(({data:{session}})=>{ accountNote.textContent=session?.user ? `Signed in as ${session.user.email}. This order will be linked to your rewards account.` : 'Not signed in. You can still order, but this order will not be linked to a rewards account.'; });

const orderForm = document.getElementById('orderForm');

// GNU Taler inventory prices. All four inventory items are KUDOS 5.00 each.
const TALER_UNIT_PRICE = 5;
const talerQuantityFields = ['personpizza', 'onemancombo', 'gpizza', 'garbread'];
const talerTotalDisplay = document.getElementById('taler-total');

function getTalerOrderTotal(formData) {
    return talerQuantityFields.reduce((total, field) => {
        const quantity = Number.parseInt(formData.get(field), 10) || 0;
        return total + (quantity * TALER_UNIT_PRICE);
    }, 0);
}

function updateTalerTotalPreview() {
    const total = getTalerOrderTotal(new FormData(orderForm));
    talerTotalDisplay.textContent = 'KUDOS ' + total.toFixed(2);
}

talerQuantityFields.forEach((field) => {
    orderForm.elements[field].addEventListener('input', updateTalerTotalPreview);
});
updateTalerTotalPreview();

orderForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const submitButton = orderForm.querySelector('input[type="submit"]');
    submitButton.disabled = true;
    submitButton.value = 'Processing...';

    try {
        const formData = new FormData(orderForm);
        const customerName = String(formData.get('customer_name') || '').trim();
        const selectedDriver = String(formData.get('driver') || '');
        const { data: { session } } = await db.auth.getSession();

        const orderData = {
            user_id: session?.user?.id || null,
            driver: selectedDriver,
            name: customerName,
            personpizza: parseInt(formData.get('personpizza')) || 0,
            onemancombo: parseInt(formData.get('onemancombo')) || 0,
            gpizza: parseInt(formData.get('gpizza')) || 0,
            garbread: parseInt(formData.get('garbread')) || 0,
            cardtype: formData.get('payment_method')
        };

        if (orderData.personpizza + orderData.onemancombo + orderData.gpizza + orderData.garbread === 0) {
            throw new Error('Please select at least one menu item.');
        }

        if (orderData.cardtype === 'GNU Taler') {
            // Keep the merchant API token on the server. This endpoint uses the
            // TALER_API_TOKEN Cloudflare Pages secret and creates a merchant order.
            const talerTotal = getTalerOrderTotal(formData);
            if (!Number.isSafeInteger(talerTotal) || talerTotal <= 0) {
                throw new Error('Please enter a valid order quantity.');
            }

            // Save the order details before handing the customer to the Taler wallet.
            const pendingOrderJson = JSON.stringify(orderData);
            try { localStorage.setItem('platinumTalerPendingOrder', pendingOrderJson); } catch (storageError) {
                console.warn('Could not save pending order in localStorage:', storageError);
            }
            sessionStorage.setItem('platinumTalerPendingOrder', pendingOrderJson);

            const createResponse = await fetch('/api/taler/create-order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(orderData)
            });
            const created = await createResponse.json();
            if (!createResponse.ok || !created.order_id) {
                throw new Error(created.error || 'GNU Taler could not create the payment.');
            }

            try { localStorage.setItem('platinumTalerOrderId', created.order_id); localStorage.setItem('platinumTalerBackendUrl', created.backend_url); } catch (storageError) {
                console.warn('Could not save Taler order ID in localStorage:', storageError);
            }
            sessionStorage.setItem('platinumTalerOrderId', created.order_id);
            sessionStorage.setItem('platinumTalerBackendUrl', created.backend_url);
            // The public order-status URL starts wallet checkout; no merchant token is exposed.
            window.location.assign(created.payment_url);
            return;
        }

        // Existing non-Taler payment methods retain their original order submission flow.
        const { error } = await db.from('orders').insert([orderData]);
        if (error) throw error;

        window.location.href = `thanks.html?driver=${encodeURIComponent(selectedDriver)}&name=${encodeURIComponent(customerName)}`;
    } catch (error) {
        console.error('Order submission error:', error);
        alert('Unable to place order: ' + (error.message || 'Unknown error'));
        submitButton.disabled = false;
        submitButton.value = 'Place Order';
    }
});
</script>
</body>
</html>
