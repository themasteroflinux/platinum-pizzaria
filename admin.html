<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Orders | Platinum Pizzaria</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        html { background-color: silver; font-family: arial; }
        div.header {
            background-color: #C1C6C8;
            color: black;
            width: 100%;
            top: 0px;
            position: fixed;
            left: 0px;
            padding: 10px;
            border-bottom: solid 2px;
            z-index: 1000;
        }
        .container { margin-top: 120px; padding: 20px; }
        .order-card {
            border: solid 2px black;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
            background-color: white;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.2);
        }
        .order-header { border-bottom: 1px solid #ccc; margin-bottom: 10px; }
        .driver-tag { font-weight: bold; color: blue; }
        .item-list { list-style: none; padding: 0; }
        .loading { font-style: italic; color: #555; }
        
        /* Simple styling for the password overlay */
        #lock-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #C1C6C8;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        input { padding: 10px; font-size: 16px; border: 2px solid black; }
        button { padding: 10px 20px; background: black; color: white; cursor: pointer; margin-top: 10px; }
    </style>
    <link rel="icon" type="image/x-icon" href="fav.png">
</head>
<body>

<div id="lock-screen">
    <img src="logo.png" height="60px" alt="Logo"><br>
    <h2>Manager Access Required</h2>
    <form id="login-form">
      <input type="email" id="email" placeholder="Manager email" autocomplete="email" required><br>
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" required><br>
      <button type="submit">Login</button>
    </form>
    <p id="fail-msg" style="color:red;display:none"></p>
</div>
<div class="header"><img src="logo.png" height="40px" alt="Logo"><br><a href="index.html" style="color:black;text-decoration:none;">Home</a> | <strong>Order Manager</strong> | <a href="rewards.html" style="color:black;text-decoration:none;">Rewards</a></div>
<div class="container"><h1>Incoming Orders</h1><div id="orders-container"><p class="loading">Waiting for authentication...</p></div></div>
<script>
const db=supabase.createClient('https://rrpnmxucqlpaaueufsmb.supabase.co','sb_publishable_scPdBcRV7V0X_VN1IaZPsw_BxxCvxmN');
const lock=document.getElementById('lock-screen'), msg=document.getElementById('fail-msg');
async function load(){
 const {data:{user}}=await db.auth.getUser();
 if(!user){lock.style.display='flex';return;}
 const role=user.app_metadata?.role;
 if(role!=='manager' && role!=='admin'){msg.textContent='This account is not authorized for manager access.';msg.style.display='block';return;}
 lock.style.display='none'; fetchOrders();
}
document.getElementById('login-form').addEventListener('submit',async e=>{e.preventDefault();msg.style.display='none';const {error}=await db.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){msg.textContent=error.message;msg.style.display='block';return}load()});
async function fetchOrders(){const c=document.getElementById('orders-container');c.innerHTML='<p class="loading">Fetching orders...</p>';const {data:orders,error}=await db.from('orders').select('id,name,driver,cardtype,personpizza,onemancombo,gpizza,garbread,user_id').order('id',{ascending:false});if(error){c.innerHTML='<p style="color:red">Unable to load orders: '+error.message+'</p>';return}if(!orders?.length){c.innerHTML='<p>No orders found.</p>';return}c.innerHTML='';orders.forEach(order=>{const d=document.createElement('div');d.className='order-card';d.innerHTML=`<div class="order-header"><h3>Order for: ${escapeHtml(order.name||'Unknown')}</h3><p>Driver: <span class="driver-tag">${escapeHtml(order.driver||'Unassigned')}</span></p></div><ul class="item-list">${order.personpizza>0?`<li>🍕 Personal Pizza: ${order.personpizza}</li>`:''}${order.onemancombo>0?`<li>🥤🍕 One Man Combo: ${order.onemancombo}</li>`:''}${order.gpizza>0?`<li>🍕 Group Pizza: ${order.gpizza}</li>`:''}${order.garbread>0?`<li>🥖 Garlic Bread: ${order.garbread}</li>`:''}</ul><small>Payment: ${escapeHtml(order.cardtype||'N/A')}</small><br><button onclick="deleteOrder('${order.id}')">Check off order</button>`;c.appendChild(d)})}
async function deleteOrder(id){if(!confirm('Are you sure you want to check off this order?'))return;const {error}=await db.from('orders').delete().eq('id',id);if(error)alert('Error deleting order: '+error.message);else fetchOrders()}
function escapeHtml(v){return String(v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
load();
</script>
</body>
</html>
